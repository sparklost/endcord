repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: update-version
        name: update-version
        entry: uv run tools/update_version.py
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: ensure-copyright
        name: ensure-copyright
        entry: uv run tools/ensure_copyright.py
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: scour
        name: Optimize SVG with Scour
        entry: python3 -c "import sys, pathlib, scour.scour as s; opts = s.parse_args(['--remove-metadata', '--enable-comment-stripping', '--indent=space', '--nindent=2']); [p.write_text(s.scourString(p.read_text(), opts)) for f in sys.argv[1:] if (p := pathlib.Path(f))]"
        language: python
        types: [svg]
        additional_dependencies: ['scour']
