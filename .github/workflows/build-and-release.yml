name: Build and Release
run-name: ${{ github.workflow }} for ${{ github.ref_name }}
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_macos_arm:
        description: 'Build macOS ARM'
        type: boolean
        default: true
      build_macos_intel:
        description: 'Build macOS Intel'
        type: boolean
        default: true
      create_release:
        description: 'Draft Release'
        type: boolean
        default: true

env:
  PYTHONUNBUFFERED: "1"
  # Linux
  LINUX_PYTHON_VERSION: "3.14.6"
  LINUX_CLANG_VERSION: "22.1.3"
  LINUX_USE_NUITKA: "true"
  LINUX_USE_CLANG: "true"
  # Windows
  WIN_PYTHON_VERSION: "3.14"
  WIN_USE_NUITKA: "true"
  WIN_USE_CLANG: "false"   # https://github.com/Nuitka/Nuitka/issues/3621
  # macOS ARM
  MAC_ARM_PYTHON_VERSION: "3.14"
  MAC_ARM_CLANG_VERSION: "21.1.8"
  MAC_ARM_USE_NUITKA: "false"
  MAC_ARM_USE_CLANG: "true"
  # macOS Intel
  MAC_INTEL_PYTHON_VERSION: "3.14"
  MAC_INTEL_CLANG_VERSION: "21.1.8"
  MAC_INTEL_USE_NUITKA: "false"
  MAC_INTEL_USE_CLANG: "true"



jobs:
  build-linux:
    name: Build (Linux)
    if: github.event_name == 'push' || inputs.build_linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update --fix-missing
          sudo apt install -y patchelf ccache lld build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev wget curl libncursesw5-dev \
            xz-utils tk-dev libffi-dev liblzma-dev \
            pkg-config libgirepository-2.0-dev libcairo2-dev gir1.2-gtk-3.0 gir1.2-pango-1.0

      - name: Ensure no BLAS/LAPACK
        run: |
          sudo apt-get purge -y libopenblas-dev libopenblas0 libblas-dev liblapack-dev
          sudo apt-get autoremove -y

      - name: Install LLVM and Clang
        if: env.LINUX_USE_CLANG == 'true'
        shell: bash
        run: |
          MAJOR_VERSION=$(echo "${LINUX_MACOS_INTEL}" | cut -d. -f1)
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh $MAJOR_VERSION
          sudo mkdir -p /usr/lib/bfd-plugins
          sudo ln -sf /usr/bin/clang-$MAJOR_VERSION /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$MAJOR_VERSION /usr/bin/clang++
          sudo ln -sf /usr/bin/llvm-profdata-$MAJOR_VERSION /usr/bin/llvm-profdata
          sudo ln -sf /usr/bin/llvm-ar-$MAJOR_VERSION /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-$MAJOR_VERSION /usr/bin/llvm-ranlib
          sudo ln -sf /usr/bin/llvm-nm-$MAJOR_VERSION /usr/bin/llvm-nm
          sudo ln -sf /usr/lib/llvm-$MAJOR_VERSION/lib/LLVMgold.so /usr/lib/bfd-plugins/LLVMgold.so
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=llvm-ranlib" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          VERSION_FILE="/usr/lib/llvm-$MAJOR_VERSION/include/llvm/Config/llvm-config.h"
          if [ -f "$VERSION_FILE" ]; then   # cleanup version string
            sudo sed -i -E 's/(\+[0-9a-f~exp]+[-[0-9a-f~exp\.]*)//g' "$VERSION_FILE"
          fi

      - name: Build custom Python
        shell: bash
        run: |
          chmod +x ./tools/build_python.sh
          CURSES_VERSION=$(sed -n '/^\[build\]/,/^\[/p' pyproject.toml | grep '^curses_tag' | cut -d '"' -f 2)
          if [ -z "$CURSES_VERSION" ]; then
            echo "Error: Could not extract curses_tag from pyproject.toml"
            exit 1
          fi
          args=("${LINUX_PYTHON_VERSION}")
          [[ "${LINUX_USE_CLANG}" == "true" ]] && args+=("clang")
          ./tools/build_python.sh "${args[@]}" curses "$CURSES_VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Run build script [FULL]
        shell: bash
        run: |
          uv venv --clear --python .cpython/bin/python3
          args=("--custom-python")
          [[ "${LINUX_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${LINUX_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=FULL "${args[@]}"

      - name: Run build script [LITE]
        shell: bash
        run: |
          args=("--custom-python")
          [[ "${LINUX_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${LINUX_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=LITE "${args[@]}"

      - name: Run build script [GUI]
        shell: bash
        run: |
          args=("--custom-python")
          [[ "${LINUX_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${LINUX_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --toggle-windowed
          uv run build.py --level=FULL "${args[@]}"

      - name: Make binaries executable
        run: chmod +x ./dist/endcord ./dist/endcord-lite || true

      - name: Archive files
        shell: bash
        run: |
          version=${GITHUB_REF#refs/tags/}
          extra="README.md LICENSE docs/commands.md docs/configuration.md docs/extensions.md docs/keybindings.md"
          cd dist && mkdir -p docs && cp ../README.md ../LICENSE . && cp ../docs/*.md docs/
          tar -czf "endcord-$version-linux.tar.gz" endcord $extra
          tar -czf "endcord-lite-$version-linux.tar.gz" endcord-lite $extra
          tar -czf "endcord-gui-$version-linux.tar.gz" endcord-gui $extra

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: ./dist/*.tar.gz
          compression-level: 0


  build-windows:
    name: Build (Windows)
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        shell: bash
        run: |
            choco install ccache -y
            echo UV_LINK_MODE=copy >> $GITHUB_ENV

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.WIN_PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install gvsbuild GTK3
        shell: bash
        run: |
          DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/wingtk/gvsbuild/releases/latest" | jq -r '.assets[] | select(.name | startswith("GTK3_Gvsbuild_") and endswith("_x64.zip")) | .browser_download_url')
          curl -L "$DOWNLOAD_URL" -o gtk3.zip
          mkdir -p /c/gtk
          unzip -q gtk3.zip -d /c/gtk
          echo 'C:\gtk\bin' >> $GITHUB_PATH
          echo 'LIB=C:\gtk\lib;'$LIB >> $GITHUB_ENV
          echo 'INCLUDE=C:\gtk\include;C:\gtk\include\cairo;C:\gtk\include\glib-2.0;C:\gtk\include\gobject-introspection-1.0;C:\gtk\lib\glib-2.0\include;'$INCLUDE >> $GITHUB_ENV
          echo "GTK_ROOT=C:\gtk" >> $GITHUB_ENV

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        if: env.WIN_USE_CLANG == 'true'
        with:
          version: ${{ matrix.clang-version }}

      - name: Run build script [FULL]
        shell: bash
        run: |
          args=()
          [[ "${WIN_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${WNDOWS_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=FULL "${args[@]}"

      - name: Run build script [LITE]
        shell: bash
        run: |
          args=()
          [[ "${WIN_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${WNDOWS_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=LITE "${args[@]}"

      # - name: Run build script [GUI]
      #   shell: bash
      #   run: |
      #     args=()
      #     [[ "${WIN_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
      #     [[ "${WNDOWS_USE_CLANG}" != "true" ]] && args+=("--noclang")
      #     uv run build.py --toggle-windowed
      #     uv run build.py --level=FULL "${args[@]}"

      - name: Archive artifacts
        shell: bash
        run: |
          version=${GITHUB_REF#refs/tags/}
          version=${version#refs/heads/}
          extra="README.md LICENSE docs/commands.md docs/configuration.md docs/extensions.md docs/keybindings.md"
          cd dist && mkdir -p docs && cp ../README.md ../LICENSE . && cp ../docs/*.md docs/
          7z a "endcord-$version-windows.zip" endcord.exe $extra
          7z a "endcord-lite-$version-windows.zip" endcord-lite.exe $extra
          # 7z a "endcord-gui-$version-windows.zip" endcord-gui.exe $extra

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: ./dist/*.zip
          compression-level: 0


  build-macos-arm:
    name: Build (macOS ARM)
    if: github.event_name == 'push' || inputs.build_macos_arm
    runs-on: macos-15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ccache
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        if: env.MAC_ARM_USE_CLANG == 'true'
        with:
          version: ${{ env.MAC_ARM_MACOS_INTEL }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.MAC_ARM_PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Run build script [FULL]
        shell: bash
        run: |
          args=()
          [[ "${MAC_ARM_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${MAC_ARM_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=FULL "${args[@]}"

      - name: Run build script [LITE]
        shell: bash
        run: |
          args=()
          [[ "${MAC_ARM_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${MAC_ARM_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=LITE "${args[@]}"

      - name: Make binaries executable
        run: chmod +x ./dist/endcord ./dist/endcord-lite || true

      - name: Archive files
        shell: bash
        run: |
          version=${GITHUB_REF#refs/tags/}
          version=${version#refs/heads/}
          extra="README.md LICENSE docs/commands.md docs/configuration.md docs/extensions.md docs/keybindings.md"
          cd dist && mkdir -p docs && cp ../README.md ../LICENSE . && cp ../docs/*.md docs/
          zip "endcord-$version-macos-arm64.zip" endcord $extra
          zip "endcord-lite-$version-macos-arm64.zip" endcord-lite $extra

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: ./dist/*.zip
          compression-level: 0


  build-macos-intel:
    name: Build (macOS Intel)
    if: github.event_name == 'push' || inputs.build_macos_intel
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ccache
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        if: env.MAC_INTEL_USE_CLANG == 'true'
        with:
          version: ${{ env.MAC_INTEL_MACOS_INTEL }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.MAC_INTEL_PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Run build script [FULL]
        shell: bash
        run: |
          args=()
          [[ "${MAC_INTEL_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${MAC_INTEL_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=FULL "${args[@]}"

      - name: Run build script [LITE]
        shell: bash
        run: |
          args=()
          [[ "${MAC_INTEL_USE_NUITKA}" == "true" ]] && args+=("--nuitka")
          [[ "${MAC_INTEL_USE_CLANG}" != "true" ]] && args+=("--noclang")
          uv run build.py --level=LITE "${args[@]}"

      - name: Make binaries executable
        run: chmod +x ./dist/endcord ./dist/endcord-lite || true

      - name: Archive files
        shell: bash
        run: |
          version=${GITHUB_REF#refs/tags/}
          version=${version#refs/heads/}
          extra="README.md LICENSE docs/commands.md docs/configuration.md docs/extensions.md docs/keybindings.md"
          cd dist && mkdir -p docs && cp ../README.md ../LICENSE . && cp ../docs/*.md docs/
          zip "endcord-$version-macos-x86_64.zip" endcord $extra
          zip "endcord-lite-$version-macos-x86_64.zip" endcord-lite $extra

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-intel
          path: ./dist/*.zip
          compression-level: 0


  draft-release:
    name: Draft GitHub Release
    needs: [build-linux, build-windows, build-macos-arm, build-macos-intel]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (github.event_name == 'push' || inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Extract version from tag/branch
        id: extract_version
        run: |
          version=${GITHUB_REF#refs/tags/}
          version=${version#refs/heads/}
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Generate release attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Draft a release
        uses: softprops/action-gh-release@v3
        with:
          name: '${{ steps.extract_version.outputs.version }} [DRAFTED BY CI]'
          tag_name: '${{ steps.extract_version.outputs.version }}'
          draft: true
          prerelease: ${{ contains(steps.extract_version.outputs.version, 'dev') }}
          files: dist/*
          generate_release_notes: true
